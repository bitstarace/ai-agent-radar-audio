name: Daily report audio to Drive

on:
  schedule:
    # 08:15 JST (= 23:15 UTC 前日) に実行。takeday/ai-agent-radar のレポート生成(07:30 JST)後に走る。
    - cron: "15 23 * * *"
  workflow_dispatch: {}

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write service account key
        run: echo "$GDRIVE_SERVICE_ACCOUNT_JSON" > /tmp/service-account.json
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}

      - name: Generate audio and upload to Drive
        run: python scripts/main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON_PATH: /tmp/service-account.json
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
